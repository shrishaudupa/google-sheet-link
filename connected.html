<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Sheets Integration</title>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: "Segoe UI", 
            sans-serif; 
        }
        body { background: #f4f6f9; padding: 20px; }
        .container { width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; }
        .source-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.08); }
        button { background: #1a73e8; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }

        /* Preview Modal Styles */
        #previewContainer { display: none; background: white; padding: 20px; border-radius: 10px; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #previewTable { width: 100%; border-collapse: collapse; margin-top: 15px; }
        #previewTable td { border: 1px solid #ddd; padding: 8px; cursor: pointer; }
        #previewTable tr:hover { background-color: #f1f3f4; }
        #previewTable tr.selected-row { background-color: #e8f0fe; }
        #previewHint { color: #5f6368; font-size: 13px; margin-top: 4px; }

        /* Sheet (tab) picker modal styles */
        #sheetTabModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
        }
        #sheetTabModalContent {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        #sheetTabList { list-style: none; margin-top: 15px; }
        #sheetTabList li {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        #sheetTabList li:hover { background: #f1f3f4; }
        #sheetTabList li.selected { border-color: #1a73e8; background: #e8f0fe; }
    </style>
</head>
<body>

<div class="container">
    <h1>Google Sheets Integration</h1>
    <p id="statusMessage" style="text-align:center;">Map every source to its Google Sheet.</p>
    <div id="sourcesContainer"></div>

    <!-- Preview Section -->
    <div id="previewContainer">
        <h3>Click the row that contains your headers</h3>
        <p id="previewHint">The row you click will be used as column headers for this sheet.</p>
        <table id="previewTable"></table>
        <button onclick="document.getElementById('previewContainer').style.display='none'" style="margin-top:10px; background:#5f6368;">Close</button>
    </div>
</div>

<!-- Sheet Tab Picker Modal -->
<div id="sheetTabModal">
    <div id="sheetTabModalContent">
        <h3>Choose a sheet (tab)</h3>
        <p style="margin-top:5px; color:#5f6368; font-size:13px;">This spreadsheet has multiple sheets. Select the one you want to use.</p>
        <ul id="sheetTabList"></ul>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
            <button id="cancelSheetTabBtn" style="background:#5f6368;">Cancel</button>
            <button id="confirmSheetTabBtn">Continue</button>
        </div>
    </div>
</div>

<script>
    const ZYGN_ACCESS_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyIjp7ImlkIjoxLCJlbWFpbCI6ImFyaXZ1QGdtYWlsLmNvbSIsImZ1bGxuYW1lIjoiU2FnYXIgQmlyYWRhciIsImluaXRpYWxzIjoiU0IiLCJ1c2VyVHlwZSI6IkVtcGxveWVlIiwiZW1wbG95ZWVJZCI6MSwiY29tcGFueUlkIjoxLCJmaXJzdE5hbWUiOiJTYWdhciIsImxhc3ROYW1lIjoiQmlyYWRhciIsIm1vYmlsZU51bWJlciI6IjkxNjQzNjEyMzgiLCJlbXBsb3llZUVtYWlsSWQiOiJzYWdhci56eWduQGdtYWlsLmNvbSIsImVtcGxveWVlTnVtYmVyIjoiRU1QMDAwMDEiLCJhY2Nlc3MiOiJFbmFibGVkIiwiYXR0ZW5kYW5jZSI6IkVuYWJsZWQiLCJ2aXNpdG9ySWQiOiJmNTY4YTBlOWM1YTJmMHdlYjcyMzRjIiwiY29tcGFueU5hbWUiOiJQVEcgUFZUIExURCIsInRvTWFpbCI6InB0Z3RlY2giLCJlbXBsb3llZVR5cGUiOiJVc2VyIiwiY29tcGFueVN0YXR1cyI6IkFjdGl2ZSIsImNvbXBhbnlUeXBlIjoiQ3VzdG9tZXIiLCJjb21wYW55Z3N0TnVtYmVyIjoiR1NUSU4yOTA5ODg5RDYiLCJjb21wYW55UmVnaXN0ZXJlZFllYXIiOjIwMjMsImNvdW50cnlDb2RlIjoiSU4iLCJjb3VudHJ5IjoiSW5kaWEifSwiZW1wbG95ZWVSb2xlcyI6W3sidGVhbSI6IkhSIiwicm9sZSI6Ik1hbmFnZXIifSx7InRlYW0iOiJNYXJrZXRpbmciLCJyb2xlIjoiTWFuYWdlciJ9LHsidGVhbSI6IlNhbGVzIiwicm9sZSI6Ik1hbmFnZXIifSx7InRlYW0iOiJEZXNpZ24iLCJyb2xlIjoiTWFuYWdlciJ9LHsidGVhbSI6IkludmVudG9yeSIsInJvbGUiOiJNYW5hZ2VyIn0seyJ0ZWFtIjoiQWNjb3VudHMiLCJyb2xlIjoiRXhlY3V0aXZlIn0seyJ0ZWFtIjoiT25zaXRlIiwicm9sZSI6Ik1hbmFnZXIifSx7InRlYW0iOiJQcm9jdXJlbWVudCIsInJvbGUiOiJNYW5hZ2VyIn0seyJ0ZWFtIjoiUHJvZHVjdGlvbiIsInJvbGUiOiJNYW5hZ2VyIn0seyJ0ZWFtIjoiQWRtaW4iLCJyb2xlIjoiTWFuYWdlciJ9XSwiaWF0IjoxNzg1ODI1Njk0LCJleHAiOjE3ODU4Njg4OTR9.L7S5fD3vjCrZOPTD1uHFHOW9lwkUhN0x3Szn-YvYizo";

    const ACCESS_TOKEN_URL = "http://localhost:5001/api/googleSheetsIntegration/getAccessToken";
    const PREVIEW_URL = "http://localhost:5001/api/googleSheetsIntegration/getSheetPreview";
    const SAVE_SHEETS_URL = "http://localhost:5001/api/googleSheetsIntegration/saveSheets";
    const SHEET_TABS_URL = "http://localhost:5001/api/googleSheetsIntegration/getSheetTabs";

    let pickerApiLoaded = false;
    let currentSourceId = null;
    let currentSheetId = null; // spreadsheet file id
    let currentSheetTabName = null; // selected tab name (e.g. "Sheet1")
    let currentUserRefreshToken = null; // used for all backend calls (picker itself uses the short-lived accessToken)
    const DEFAULT_HEADER_ROW_INDEX = 0;
    const PREVIEW_ROW_LIMIT = 10; // how many rows to show in the header-picker preview
    const sources = [{id: 1, name: "Source 1"}, {id: 2, name: "Source 2"}, {id: 3, name: "Source 3"}];

    function gapiLoaded() { gapi.load("picker", { callback: () => { pickerApiLoaded = true; } }); }

    function renderSources() {
        const container = document.getElementById("sourcesContainer");
        container.innerHTML = sources.map(s => `
            <div class="source-card">
                <div><h3>${s.name}</h3><small>ID: ${s.id}</small></div>
                <button onclick="selectSheet(${s.id})">Select Google Sheet</button>
            </div>
        `).join('');
    }

    async function selectSheet(sourceId) {
        if (!pickerApiLoaded) return alert("Picker loading...");
        currentSourceId = sourceId;
        const tokenResponse = await (
            await fetch(ACCESS_TOKEN_URL, {
                headers: {
                    Authorization: `Bearer ${ZYGN_ACCESS_TOKEN}`
                }
            })
        ).json();

        const accessToken = tokenResponse.accessToken;       // for the Picker widget + read-only preview/tabs calls
        currentUserRefreshToken = tokenResponse.refreshToken; // for saveSheets, which needs long-term access

        new google.picker.PickerBuilder()
            .addView(google.picker.ViewId.SPREADSHEETS)
            .setOAuthToken(accessToken)
            .setDeveloperKey("AIzaSyBpjQ4tq3kspJbs2b5u3GGI_1dWLngMeNU")
            .setCallback(async (data) => {
                if (data.action === google.picker.Action.PICKED) {
                    currentSheetId = data.docs[0].id;
                    await promptForSheetTab(accessToken, currentSheetId);
                }
            }).build().setVisible(true);
    }

    async function promptForSheetTab(accessToken, sheetId) {
        const res = await fetch(SHEET_TABS_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${ZYGN_ACCESS_TOKEN}`
            },
            body: JSON.stringify({
                accessToken,
                sheetId
            })
        });

        const { sheetTabs } = await res.json(); // [{ sheetId, title, index }, ...]

        if (!sheetTabs || sheetTabs.length === 0) {
            alert("No sheets found in this spreadsheet.");
            return;
        }

        if (sheetTabs.length === 1) {
            // Only one tab exists, skip the picker and go straight to the header-row preview
            currentSheetTabName = sheetTabs[0].title;
            await loadPreview(accessToken);
            return;
        }

        renderSheetTabModal(sheetTabs, accessToken);
    }

    function renderSheetTabModal(sheetTabs, accessToken) {
        const list = document.getElementById('sheetTabList');
        list.innerHTML = "";
        let selectedTab = null;

        sheetTabs.forEach(tab => {
            const li = document.createElement('li');
            li.textContent = tab.title;
            li.onclick = () => {
                document.querySelectorAll('#sheetTabList li').forEach(el => el.classList.remove('selected'));
                li.classList.add('selected');
                selectedTab = tab.title;
            };
            list.appendChild(li);
        });

        document.getElementById('sheetTabModal').style.display = 'flex';

        document.getElementById('confirmSheetTabBtn').onclick = async () => {
            if (!selectedTab) {
                alert("Please select a sheet tab first.");
                return;
            }
            currentSheetTabName = selectedTab;
            document.getElementById('sheetTabModal').style.display = 'none';
            await loadPreview(accessToken);
        };

        document.getElementById('cancelSheetTabBtn').onclick = () => {
            document.getElementById('sheetTabModal').style.display = 'none';
        };
    }

    // Fetches a handful of rows from the chosen sheet/tab so the user can pick which one is the header row.
    async function loadPreview(accessToken) {
        const statusEl = document.getElementById('statusMessage');
        statusEl.textContent = "Loading preview...";

        try {
            const res = await fetch(PREVIEW_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${ZYGN_ACCESS_TOKEN}`
                },
                body: JSON.stringify({
                    accessToken,
                    sheetId: currentSheetId,
                    sheetTabName: currentSheetTabName,
                    rowLimit: PREVIEW_ROW_LIMIT
                })
            });

            if (!res.ok) throw new Error(`Preview request failed (${res.status})`);

            const { rows } = await res.json(); // rows: string[][], each inner array is one spreadsheet row

            if (!rows || rows.length === 0) {
                alert("This sheet appears to be empty.");
                statusEl.textContent = "Map every source to its Google Sheet.";
                return;
            }

            statusEl.textContent = "Map every source to its Google Sheet.";
            renderPreview(rows);
        } catch (err) {
            console.error("Failed to load preview:", err);
            statusEl.textContent = "Couldn't load a preview for that sheet. Please try again.";
        }
    }

    function renderPreview(rows) {
        const table = document.getElementById('previewTable');
        table.innerHTML = "";

        rows.forEach((row, rowIndex) => {
            const tr = document.createElement('tr');
            tr.onclick = () => {
                document.querySelectorAll('#previewTable tr').forEach(el => el.classList.remove('selected-row'));
                tr.classList.add('selected-row');
                // Spreadsheet rows are 1-indexed, and the preview starts at row 1 (A1:Z...),
                // so the row a user clicks at array position `rowIndex` is sheet row `rowIndex + 1`.
                const headerRowNo = rowIndex + 1;
                selectHeaderRow(currentUserRefreshToken, row, headerRowNo);
            };
            row.forEach(cell => {
                const td = document.createElement('td');
                td.textContent = (cell === undefined || cell === null || cell === "") ? '(empty)' : cell;
                tr.appendChild(td);
            });
            table.appendChild(tr);
        });

        document.getElementById('previewContainer').style.display = "block";
    }

    async function selectHeaderRow(currentUserRefreshToken, headerRow = [], headerRowNo) {
        const dbColumns = ["Name", "Email", "Phone"];
        const headerMapping = {};

        dbColumns.forEach((col, index) => {
            headerMapping[col] = headerRow[index] || "Unmapped";
        });

        const sourceName = sources.find(s => s.id === currentSourceId)?.name || "source";
        document.getElementById('statusMessage').textContent = `Saving header mapping for ${sourceName}...`;

        try {
            const res = await fetch(SAVE_SHEETS_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${ZYGN_ACCESS_TOKEN}`
                },
                body: JSON.stringify({
                    userRefreshToken: currentUserRefreshToken, // saveSheets needs this, not the access token
                    sourceId: currentSourceId,
                    headerMapping,
                    sheetId: currentSheetId,
                    sheetTabName: currentSheetTabName,
                    headerRowNo
                })
            });

            if (!res.ok) throw new Error(`Save request failed (${res.status})`);

            document.getElementById('statusMessage').textContent = `Headers mapped for ${sourceName}.`;
        } catch (err) {
            console.error("Failed to save header mapping:", err);
            document.getElementById('statusMessage').textContent = `Couldn't save headers for ${sourceName}. Please try again.`;
        } finally {
            document.getElementById('previewContainer').style.display = 'none';
        }
    }

    renderSources();
</script>
</body>
</html>
