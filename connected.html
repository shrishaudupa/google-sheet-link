<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Sheets Integration</title>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: "Segoe UI", 
            sans-serif; 
        }
        body { background: #f4f6f9; padding: 20px; }
        .container { width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; }
        .source-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.08); }
        button { background: #1a73e8; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
        
        /* Preview Modal Styles */
        #previewContainer { display: none; background: white; padding: 20px; border-radius: 10px; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #previewTable { width: 100%; border-collapse: collapse; margin-top: 15px; }
        #previewTable td { border: 1px solid #ddd; padding: 8px; cursor: pointer; }
        #previewTable tr:hover { background-color: #f1f3f4; }
    </style>
</head>
<body>

<div class="container">
    <h1>Google Sheets Integration</h1>
    <p id="statusMessage" style="text-align:center;">Map every source to its Google Sheet.</p>
    <div id="sourcesContainer"></div>

    <!-- Preview Section -->
    <div id="previewContainer">
        <h3>Click the row that contains your headers</h3>
        <table id="previewTable"></table>
        <button onclick="document.getElementById('previewContainer').style.display='none'" style="margin-top:10px; background:#5f6368;">Close</button>
    </div>
</div>

<script>
    const ACCESS_TOKEN_URL = "http://localhost:5001/api/googleSheetsIntegration/getAccessToken";
    const PREVIEW_URL = "http://localhost:5001/api/googleSheetsIntegration/getSheetPreview";
    
    let pickerApiLoaded = false;
    let currentSourceId = null;
    const DEFAULT_HEADER_ROW_INDEX = 0;
    const sources = [{id: 1, name: "Source 1"}, {id: 2, name: "Source 2"}, {id: 3, name: "Source 3"}];

    function gapiLoaded() { gapi.load("picker", { callback: () => { pickerApiLoaded = true; } }); }

    function renderSources() {
        const container = document.getElementById("sourcesContainer");
        container.innerHTML = sources.map(s => `
            <div class="source-card">
                <div><h3>${s.name}</h3><small>ID: ${s.id}</small></div>
                <button onclick="selectSheet(${s.id})">Select Google Sheet</button>
            </div>
        `).join('');
    }

    async function selectSheet(sourceId) {
        if (!pickerApiLoaded) return alert("Picker loading...");
        currentSourceId = sourceId;
        const tokenData = await (await fetch(ACCESS_TOKEN_URL)).json();
        
        new google.picker.PickerBuilder()
            .addView(google.picker.ViewId.SPREADSHEETS)
            .setOAuthToken(tokenData.accessToken)
            .setDeveloperKey("AIzaSyBpjQ4tq3kspJbs2b5u3GGI_1dWLngMeNU")
            .setCallback(async (data) => {
                if (data.action === google.picker.Action.PICKED) {
                    const res = await fetch(PREVIEW_URL, {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ fileId: data.docs[0].id })
                    });
                    
                    const { rows } = await res.json();
                    const defaultHeaders = rows[DEFAULT_HEADER_ROW_INDEX] || [];

                    selectHeaderRow(defaultHeaders);
                    renderPreview(rows);
                }
            }).build().setVisible(true);
    }

    function renderPreview(rows) {
        const table = document.getElementById('previewTable');
        table.innerHTML = "";
        rows.forEach(row => {
            const tr = document.createElement('tr');
            tr.onclick = () => selectHeaderRow(row);
            row.forEach(cell => tr.innerHTML += `<td>${cell || '(empty)'}</td>`);
            table.appendChild(tr);
        });
        document.getElementById('previewContainer').style.display = "block";
    }

    function selectHeaderRow(headerRow) {
        console.log("Selected headers:", headerRow);
        console.log("Selected sourceId:", currentSourceId);

        const dbColumns = ["Name", "Email", "Phone"];
        const mapping = {};
        
        dbColumns.forEach((col, index) => {
            mapping[col] = headerRow[index] || "Unmapped";
        });

        console.log(`Mapping for Source ${currentSourceId}:`, mapping);
        document.getElementById('previewContainer').style.display = 'none';
    }

    renderSources();
</script>
</body>
</html>
